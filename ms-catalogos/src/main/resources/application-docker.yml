spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/catalogos
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
  security:
    enabled: false
    basic:
      enabled: false
    oauth2:
      resourceserver:
        jwt:
          enabled: false
server:
  port: 8081 # Puerto interno para el microservicio
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ms-catalogos
