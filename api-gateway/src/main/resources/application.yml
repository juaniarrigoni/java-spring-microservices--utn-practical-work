server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers
      globalcors:
        cors-configurations:
          '[/**]':
            # Lista explícita para evitar el error "allowCredentials + *".
            # Agrega aquí los orígenes que necesites habilitar.
            allowedOrigins:
              - "http://localhost"
              - "http://localhost:8080"
              - "http://127.0.0.1"
              - "http://127.0.0.1:8080"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

gateway:
  security:
    enabled: false # Mantiene el gateway abierto hasta que Keycloak esté disponible
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: api-gateway
