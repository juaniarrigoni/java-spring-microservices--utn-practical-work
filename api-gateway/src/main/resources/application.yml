server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

springdoc:
  swagger-ui:
    path: /swagger

tpi:
  gateway:
    services:
      catalogos:
        uri: http://${CATALOGOS_HOST:localhost}:${CATALOGOS_PORT:8081}
      solicitudes:
        uri: http://${SOLICITUDES_HOST:localhost}:${SOLICITUDES_PORT:8082}
      operaciones:
        uri: http://${OPERACIONES_HOST:localhost}:${OPERACIONES_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
