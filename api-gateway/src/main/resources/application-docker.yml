# RUTA: api-gateway/src/main/resources/application-docker.yml

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # LA SECCIÓN 'globalcors' HA SIDO ELIMINADA DE AQUÍ

      routes:
        - id: ms-catalogos
          uri: http://ms-catalogos:8081
          predicates:
            - Path=/api/catalogos/**
          filters:
            - StripPrefix=2

        - id: ms-solicitudes
          uri: http://ms-solicitudes:8082
          predicates:
            - Path=/api/solicitudes/**
          filters:
            - StripPrefix=2

        - id: ms-operaciones
          uri: http://ms-operaciones:8083
          predicates:
            - Path=/api/operaciones/**
          filters:
            - StripPrefix=2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8084/realms/tpi-backend

server:
  port: 8080

gateway:
  security:
    enabled: false # Cambiar a 'true' cuando Keycloak esté configurado

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: api-gateway
