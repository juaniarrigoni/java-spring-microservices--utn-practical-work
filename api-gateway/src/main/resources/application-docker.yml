spring:
  cloud:
    gateway:
      routes:
        - id: ms-catalogos
          uri: http://ms-catalogos:8081
          predicates:
            - Path=/api/catalogos/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Forwarded-Prefix, /api/catalogos

        - id: ms-solicitudes
          uri: http://ms-solicitudes:8082
          predicates:
            - Path=/api/solicitudes/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Forwarded-Prefix, /api/solicitudes

        - id: ms-operaciones
          uri: http://ms-operaciones:8083
          predicates:
            - Path=/api/operaciones/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Forwarded-Prefix, /api/operaciones

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8084/realms/tpi-backend

# Propiedad para leer en SecurityConfig si quisiéramos desactivar seguridad
gateway:
  security:
    enabled: true