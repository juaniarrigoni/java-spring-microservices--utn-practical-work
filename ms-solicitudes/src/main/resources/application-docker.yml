spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/solicitudes
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8084/realms/tpi-backend/protocol/openid-connect/certs}

app:
  security:
    accepted-issuers:
      - http://localhost:8084/realms/tpi-backend
      - http://keycloak:8084/realms/tpi-backend