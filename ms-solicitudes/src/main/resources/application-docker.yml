spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/solicitudes
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
  security:
    enabled: false
  #  oauth2:
  #    resourceserver:
  #      jwt:
  #        issuer-uri: http://keycloak:8084/realms/master
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ms-solicitudes
