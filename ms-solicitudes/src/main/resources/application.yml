server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: ms-solicitudes
  datasource:
    url: jdbc:postgresql://localhost:5433/solicitudes
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://${KEYCLOAK_HOST:localhost}:8084/realms/tpi-backend/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always

app:
  security:
    accepted-issuers:
      - http://localhost:8084/realms/tpi-backend
      - http://keycloak:8084/realms/tpi-backend
