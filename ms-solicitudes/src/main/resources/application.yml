server:
  port: 8082
  forward-headers-strategy: framework


spring:
  application:
    name: ms-solicitudes
  datasource:
    url: jdbc:postgresql://localhost:5433/solicitudes
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: http://keycloak:8084/realms/tpi-backend

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
