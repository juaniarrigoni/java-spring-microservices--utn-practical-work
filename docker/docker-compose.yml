# RUTA: docker/docker-compose.yml

services:
  # --- BASE DE DATOS ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [tpi]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- SERVIDOR DE AUTENTICACIÓN ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: ["start-dev"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8084
    ports:
      - "8084:8084"
    volumes:
      - keycloak_data:/opt/keycloak/data
#      - ./keycloak-config:/opt/keycloak/data/import
    networks: [tpi]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://keycloak:8084/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # --- SERVICIO DE RUTEO EXTERNO (INTEGRADO DE LA RAMA OSRM) ---
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-backend
    volumes:
      - ${OSRM_DATA_PATH}:/data
    command: osrm-routed --algorithm ch /data/argentina-latest.osrm
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=5", "-O", "/dev/null", "http://osrm-backend:5000/route/v1/driving/-64.18,-31.42;-58.38,-34.60?overview=false"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks: [tpi]
    restart: unless-stopped

  # --- MICROSERVICIOS DE LA APLICACIÓN ---
  ms-catalogos:
    build: ../ms-catalogos
    image: tpi/ms-catalogos:0.1.0
    container_name: ms-catalogos
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tpi]

  ms-solicitudes:
    build: ../ms-solicitudes
    image: tpi/ms-solicitudes:0.1.0
    container_name: ms-solicitudes
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tpi]

  ms-operaciones:
    build: ../ms-operaciones
    image: tpi/ms-operaciones:0.1.0
    container_name: ms-operaciones
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
      # AÑADIDO: La variable de entorno para que sepa dónde está OSRM
      - OSRM_URL=http://osrm-backend:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      # AÑADIDO: La dependencia para que no arranque hasta que OSRM esté listo
      osrm-backend:
        condition: service_healthy
    networks: [tpi]

  # --- API GATEWAY ---
  api-gateway:
    build: ../api-gateway
    image: tpi/api-gateway:0.1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      ms-catalogos:
        condition: service_healthy
      ms-solicitudes:
        condition: service_healthy
      ms-operaciones:
        condition: service_healthy
      # AÑADIDO: Dependencia explícita de Keycloak
#      keycloak:
#        condition: service_healthy
    networks: [tpi]

networks:
  tpi: {}

volumes:
  pgdata: {}
  keycloak_data: {}