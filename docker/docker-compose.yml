services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [tpi]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ms-catalogos:
    build: ../ms-catalogos
    image: tpi/ms-catalogos:0.1.0
    container_name: ms-catalogos
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=catalogos
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tpi]

  ms-solicitudes:
    build: ../ms-solicitudes
    image: tpi/ms-solicitudes:0.1.0
    container_name: ms-solicitudes
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=solicitudes
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tpi]

  ms-operaciones:
    build: ../ms-operaciones
    image: tpi/ms-operaciones:0.1.0
    container_name: ms-operaciones
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=operaciones
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tpi]

  api-gateway:
    build: ../api-gateway
    image: tpi/api-gateway:0.1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_ENABLED=false
      - SERVER_PORT=8080
      - CATALOGOS_HOST=ms-catalogos
      - CATALOGOS_PORT=8080
      - SOLICITUDES_HOST=ms-solicitudes
      - SOLICITUDES_PORT=8080
      - OPERACIONES_HOST=ms-operaciones
      - OPERACIONES_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      ms-catalogos:
        condition: service_healthy
      ms-solicitudes:
        condition: service_healthy
      ms-operaciones:
        condition: service_healthy
    networks: [tpi]

  # keycloak (stub) — lo dejamos listo pero comentado hasta Iteración de seguridad:
