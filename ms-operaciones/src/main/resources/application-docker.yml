spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/operaciones
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    enabled: false
    #oauth2:
    #  resourceserver:
    #    jwt:
    #      issuer-uri: http://keycloak:8084/realms/master
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ms-operaciones