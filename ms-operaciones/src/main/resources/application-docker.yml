spring:
  application:
    name: ms-operaciones
  datasource:
    url: jdbc:postgresql://postgres:5432/operaciones
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8084/realms/tpi-backend

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ms-operaciones

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
