server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: ms-operaciones
  datasource:
    url: jdbc:postgresql://localhost:5433/operaciones
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8084/realms/tpi-backend
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always

# AÑADIDO: Configuración para desarrollo local (fuera de Docker)
ms-catalogos:
  url: http://localhost:8081
osrm:
  url: http://localhost:5000