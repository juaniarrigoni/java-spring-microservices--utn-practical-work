server:
  port: 8083

spring:
  application:
    name: ms-operaciones
  datasource:
    url: jdbc:h2:mem:operaciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuración de comunicación con otros microservicios
ms-catalogos:
  url: http://localhost:8081

# Configuración de OSRM para cálculo de rutas (local)
osrm:
  url: http://localhost:5000

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
